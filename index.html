<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Carousel Example</title>

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />

    <!-- jQuery (should be included before Owl Carousel JS) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Owl Carousel JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .owl-carousel, .item {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .item {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loader div {
            width: 50px;
            height: 50px;
            border: 5px solid #fff;
            border-top: 5px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="loader" id="loader"><div></div></div>
    <div class="owl-carousel" id="imageSlider" style="display: none;"></div>

    <script>
        $(document).ready(function () {
            $.getJSON("https://onlinetv.sgpconstructions.com/api/viewImage/type1", function (data) {
                let images = data.images;
                let baseUrl = "https://onlinetv.sgpconstructions.com/";
                let slider = $('#imageSlider');
                
                images.forEach(image => {
                    let imgDiv = `<div class='item' style='background-image: url(${baseUrl + image});'></div>`;
                    slider.append(imgDiv);
                });
                
                slider.owlCarousel({
                    loop: true,
                    autoplay: true,
                    autoplayTimeout: 2000,
                    autoplayHoverPause: false,
                    items: 1
                });
                
                $("#loader").fadeOut(500, function () {
                    slider.fadeIn(500);
                });
            });
        });
    </script>
</body>

</html>
