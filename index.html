<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Carousel Example</title>

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />

    <!-- jQuery (should be included before Owl Carousel JS) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Owl Carousel JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .owl-carousel, .item {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .item {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loader div {
            width: 50px;
            height: 50px;
            border: 5px solid #fff;
            border-top: 5px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Control Buttons */
        .control-btn {
            position: fixed;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            z-index: 100;
            transition: background 0.3s ease;
        }
        .control-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        .fullscreen-btn {
            top: 20px;
            right: 20px;
        }
        .pause-btn {
            bottom: 20px;
            right: 20px;
        }
        /* Video Styles */
        .fullscreen-video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            background: black;
        }
        .video-item {
            background: black;
        }
    </style>
</head>

<body>
    <div class="loader" id="loader"><div></div></div>
    <div class="owl-carousel" id="imageSlider" style="display: none;"></div>
    
    <!-- Control Buttons -->
    <button class="control-btn fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
    <button class="control-btn pause-btn" id="pauseBtn" title="Pause/Play">⏸️</button>

    <script>
        $(document).ready(function () {
            $.getJSON("https://onlinetv.sgpconstructions.com/api/viewImage/type1", function (data) {
                let images = data.all_media;
                let baseUrl = "https://onlinetv.sgpconstructions.com/";
                let slider = $('#imageSlider');
                
                images.forEach((image, index) => {
                    // Check if the file is a video based on its extension
                    let isVideo = /\.(mp4|webm|ogg|avi|mov)$/i.test(image);
                    
                    if (isVideo) {
                        let videoDiv = `<div class='item video-item' data-index='${index}'>
                            <video class='fullscreen-video' preload='metadata' muted autoplay playsinline>
                                <source src='${baseUrl + image}' type='video/mp4'>
                                Your browser does not support the video tag.
                            </video>
                        </div>`;
                        slider.append(videoDiv);
                    } else {
                        let imgDiv = `<div class='item image-item' data-index='${index}' style='background-image: url(${baseUrl + image});'></div>`;
                        slider.append(imgDiv);
                    }
                });
                
                let owl = slider.owlCarousel({
                    loop: true,
                    autoplay: true,
                    autoplayTimeout: 2000,
                    autoplayHoverPause: false,
                    items: 1
                });
                
                // Video handling functionality
                let currentVideo = null;
                let originalAutoplayTimeout = 2000;
                
                // Handle video playback when slide changes
                owl.on('changed.owl.carousel', function(event) {
                    // Stop previous video if any
                    if (currentVideo) {
                        currentVideo.pause();
                        currentVideo.currentTime = 0;
                        currentVideo.onended = null; // Remove previous event listener
                    }
                    
                    // Small delay to ensure DOM is ready
                    setTimeout(() => {
                        // Check if current slide is a video
                        let currentSlide = $('.owl-item.active .item');
                        let video = currentSlide.find('video')[0];
                        
                        if (video) {
                            currentVideo = video;
                            // Stop carousel autoplay completely
                            owl.trigger('stop.owl.autoplay');
                            
                            // Play the video with user interaction simulation for autoplay policy
                            video.play().then(() => {
                                console.log('Video started playing');
                            }).catch(e => {
                                console.log('Video play failed:', e);
                                // If video fails to autoplay, move to next slide after 3 seconds
                                setTimeout(() => {
                                    owl.trigger('next.owl.carousel');
                                }, 3000);
                            });
                            
                            // When video ends, move to next slide immediately
                            video.onended = function() {
                                console.log('Video ended, moving to next slide');
                                currentVideo = null;
                                if (!isPaused) {
                                    owl.trigger('next.owl.carousel');
                                }
                            };
                        } else {
                            currentVideo = null;
                            // If it's an image and not paused, restart autoplay
                            if (!isPaused) {
                                owl.trigger('play.owl.autoplay', [originalAutoplayTimeout]);
                            }
                        }
                    }, 100);
                });

                // Pause/Play functionality - moved inside to ensure carousel is initialized
                let isPaused = false;
                $('#pauseBtn').click(function() {
                    if (!isPaused) {
                        owl.trigger('stop.owl.autoplay');
                        // Also pause current video if any
                        if (currentVideo) {
                            currentVideo.pause();
                        }
                        $(this).html('▶️');
                        isPaused = true;
                    } else {
                        // Resume based on current slide type
                        let currentSlide = $('.owl-item.active .item');
                        let video = currentSlide.find('video')[0];
                        
                        if (video && currentVideo) {
                            currentVideo.play().catch(e => console.log('Video play failed:', e));
                        } else {
                            owl.trigger('play.owl.autoplay', [originalAutoplayTimeout]);
                        }
                        $(this).html('⏸️');
                        isPaused = false;
                    }
                });
                
                $("#loader").fadeOut(500, function () {
                    slider.fadeIn(500);
                });
            });

            // Fullscreen functionality
            let isFullscreen = false;
            $('#fullscreenBtn').click(function() {
                if (!isFullscreen) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            });

            // Track fullscreen changes
            document.addEventListener('fullscreenchange', function() {
                isFullscreen = !isFullscreen;
                $('#fullscreenBtn').html(isFullscreen ? '⛷' : '⛶');
            });
        });
    </script>
</body>

</html>
