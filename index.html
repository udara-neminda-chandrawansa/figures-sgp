<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Carousel Example</title>

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />

    <!-- jQuery (should be included before Owl Carousel JS) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Owl Carousel JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .owl-carousel, .item {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .item {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* Loading Animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loader div {
            width: 50px;
            height: 50px;
            border: 5px solid #fff;
            border-top: 5px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Control Buttons */
        .control-btn {
            position: fixed;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            z-index: 100;
            transition: background 0.3s ease;
        }
        .control-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        .fullscreen-btn {
            top: 20px;
            right: 20px;
        }
        .pause-btn {
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>

<body>
    <div class="loader" id="loader"><div></div></div>
    <div class="owl-carousel" id="imageSlider" style="display: none;"></div>
    
    <!-- Control Buttons -->
    <button class="control-btn fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
    <button class="control-btn pause-btn" id="pauseBtn" title="Pause/Play">⏸️</button>

    <script>
        $(document).ready(function () {
            $.getJSON("https://onlinetv.sgpconstructions.com/api/viewImage/type1", function (data) {
                let images = data.images;
                let baseUrl = "https://onlinetv.sgpconstructions.com/";
                let slider = $('#imageSlider');
                
                images.forEach(image => {
                    let imgDiv = `<div class='item' style='background-image: url(${baseUrl + image});'></div>`;
                    slider.append(imgDiv);
                });
                
                let owl = slider.owlCarousel({
                    loop: true,
                    autoplay: true,
                    autoplayTimeout: 2000,
                    autoplayHoverPause: false,
                    items: 1
                });
                
                // Pause/Play functionality - moved inside to ensure carousel is initialized
                let isPaused = false;
                $('#pauseBtn').click(function() {
                    if (!isPaused) {
                        owl.trigger('stop.owl.autoplay');
                        $(this).html('▶️');
                        isPaused = true;
                    } else {
                        owl.trigger('play.owl.autoplay', [2000]);
                        $(this).html('⏸️');
                        isPaused = false;
                    }
                });
                
                $("#loader").fadeOut(500, function () {
                    slider.fadeIn(500);
                });
            });

            // Fullscreen functionality
            let isFullscreen = false;
            $('#fullscreenBtn').click(function() {
                if (!isFullscreen) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            });

            // Track fullscreen changes
            document.addEventListener('fullscreenchange', function() {
                isFullscreen = !isFullscreen;
                $('#fullscreenBtn').html(isFullscreen ? '⛷' : '⛶');
            });
        });
    </script>
</body>

</html>
